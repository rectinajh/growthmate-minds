<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>GrowthMate Demo Renderer</title>
<style>
  html,body{margin:0;padding:0;background:#000;}
  canvas{display:block;width:100vw;height:56.25vw;max-height:100vh;}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
const W=1920, H=1080, FPS=30;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const DPR=1; // keep logical pixels for deterministic rendering

// ---------- palette ----------
const C={
  bg0:'#0A0B1A', bg1:'#12142E', panel:'#181B3A', panel2:'#20234A',
  line:'#2B2F5C', violet:'#7C5CFF', cyan:'#3FE0D0', coral:'#FF7A6B',
  amber:'#FFC24B', green:'#4ADE80', white:'#FFFFFF', gray:'#9AA0C3',
  dim:'#5A6085', ink:'#0B0C1D'
};

// ---------- timeline ----------
const scenes=[
  {name:'hook',      dur:9.2,  vo:0.6, draw:drawS1},
  {name:'position',  dur:13.6, vo:0.6, draw:drawS2},
  {name:'connect',   dur:11.6, vo:0.6, draw:drawS3},
  {name:'continuity',dur:11.0, vo:0.6, draw:drawS4},
  {name:'autonomy',  dur:11.4, vo:0.6, draw:drawS5},
  {name:'memory',    dur:12.6, vo:0.6, draw:drawS6},
  {name:'results',   dur:10.0, vo:0.6, draw:drawS7},
  {name:'cta',       dur:8.0,  vo:0.6, draw:drawS8}
];
const TOTAL=scenes.reduce((a,s)=>a+s.dur,0);
const NFRAMES=Math.round(TOTAL*FPS);
const VO_TEXT=[
  '创作者每天都要面对同一个问题：怎么涨粉，怎么留住每一次互动？|Every day, creators face one question: how to grow, and keep every interaction alive?',
  '现在，把这件事交给 GrowthMate——一个常驻 Minds 的涨粉参谋。它不只会聊天，它记得、会连续跟进、还会主动替你行动。|Now, hand it to GrowthMate, an always-on Minds agent. It remembers, follows up, and acts on its own.',
  '我们来看现场演示。创作者一键连接 Minds 账号，GrowthMate 就开始观察内容和粉丝，建立你的长期记忆。|Let\u2019s see it live. Connect Minds in one click, and GrowthMate starts learning your content, fans, and long-term memory.',
  '第二天早上，它记得昨天表现最好的视频，还提醒你：这条高价值评论，值得马上回复。|Next morning, it recalls yesterday\u2019s top video and flags one high-value comment worth a reply.',
  '无需任何提示，它会自动生成增长简报：粉丝趋势、视频表现，还有今天最该做的那一件事。|With no prompt, it generates a growth briefing: fan trends, video performance, and the one action that matters.',
  '它用你说话的方式帮你草拟回复——语气、习惯、甚至口吻都像你本人。你只要点一下确认，互动就完成。|It drafts replies in your own voice and tone. One tap to confirm, and the interaction is done.',
  '记住每一位粉丝，持续跟进每一次互动，自主处理每天的琐事。成长，不再只靠运气。|Remember every fan. Follow up every interaction. Automate the daily busywork. Growth stops being luck.',
  'GrowthMate：你的常驻涨粉参谋。让每一次互动，都变成增长。|GrowthMate: your always-on growth copilot. Turn every interaction into growth.'
];
let cum=[0];
for(const s of scenes) cum.push(cum[cum.length-1]+s.dur);
function sceneOf(t){for(let i=0;i<scenes.length;i++){if(t<cum[i+1])return i;}return scenes.length-1;}

// ---------- math helpers ----------
function hex(c){const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);return [r,g,b];}
function rgba(c,a){const [r,g,b]=hex(c);return `rgba(${r},${g},${b},${a})`;}
function mix(a,b,t){const A=hex(a),B=hex(b);const c=[0,1,2].map(i=>Math.round(A[i]+(B[i]-A[i])*t));return `rgb(${c[0]},${c[1]},${c[2]})`;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function ease(t){return t<0?0:t>1?1:0.5-0.5*Math.cos(Math.PI*t);}
function easeOut(t){return 1-Math.pow(1-clamp(t,0,1),3);}
function easeInOut(t){return t<0?0:t>1?1:t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function slide(t,d=30){return t<0?0:t>1?1:easeOut(t);}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function wrap(text,x,y,maxW,lh,font,maxLines=6){ctx.font=font;const words=text.split('');let line='',yy=y,n=0;for(const ch of words){const t=line+ch;if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,yy);yy+=lh;n++;line=ch;if(n>=maxLines-1){line=line+'';continue;}}else line=t;}if(line&&n<maxLines)ctx.fillText(line,x,yy);return yy+lh;}
function setFont(px,w=700,it=false){return `${it?'italic ':''}${w} ${px}px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,-apple-system,sans-serif`;}

// ---------- deterministic PRNG for particles ----------
function rng(seed){let s=seed>>>0;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const R=rng(20260825);

// ---------- background ----------
function drawBG(t,st){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,C.bg0);g.addColorStop(1,C.bg1);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // soft aurora orbs
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<3;i++){
    const ph=t*(0.4+i*0.13)+i*1.7;
    const ox=Math.sin(ph)*80+i*250-120, oy=Math.cos(ph*0.8)*60+i*180-100;
    const x=W*(0.2+i*0.33)+ox, y=H*(0.35+i*0.18)+oy, rad=340+i*80;
    const col=i===0?C.violet:i===1?C.cyan:C.coral;
    const gr=ctx.createRadialGradient(x,y,0,x,y,rad);gr.addColorStop(0,rgba(col,0.10));gr.addColorStop(1,rgba(col,0));
    ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  }
  // rising particles
  ctx.fillStyle='rgba(255,255,255,0.5)';
  for(let i=0;i<26;i++){
    const seed=(i*73)%997;
    const yy=(H+40)-(((t*(24+i*3)+seed*17)%(H+120)));
    const xx=(i*211+ Math.sin(t*(0.8+(i%5)*0.2)+i)*50)%W;
    const a=0.12+0.25*Math.abs(Math.sin(t*(1+i%4)+i));
    ctx.globalAlpha=a;ctx.beginPath();ctx.arc(xx,yy,0.8+(i%3),0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  // vignette
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.95);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.42)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  // top hairline
  const lg=ctx.createLinearGradient(0,0,W,0);lg.addColorStop(0,rgba(C.violet,0));lg.addColorStop(0.2,rgba(C.violet,0.7));lg.addColorStop(0.5,rgba(C.cyan,0.8));lg.addColorStop(0.8,rgba(C.violet,0.7));lg.addColorStop(1,rgba(C.violet,0));
  ctx.fillStyle=lg;ctx.fillRect(0,0,W,3);
}

// ---------- shared chrome ----------
function drawHeader(st){
  ctx.save();ctx.globalAlpha=0.9;
  // logo mark
  logoMark(56,54,26);
  ctx.font=setFont(24,700);ctx.fillStyle=C.white;ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText('GrowthMate',96,56);
  ctx.font=setFont(18,400);ctx.fillStyle=C.gray;ctx.fillText('涨粉参谋',230,56);
  // behavior pill
  const pill=st<scenes[0].dur?null:st<scenes[1].dur+cum[1]?'三大行为':st<scenes[2].dur+cum[2]?'记忆 · 连续 · 自主':st<scenes[3].dur+cum[3]?'连续 Continuity':st<scenes[4].dur+cum[4]?'自主 Autonomy':st<scenes[5].dur+cum[5]?'记忆 Memory':st<scenes[6].dur+cum[6]?'增长闭环':'常驻 Minds';
  if(pill){ctx.textAlign='right';ctx.font=setFont(18,600);ctx.fillStyle=rgba(C.cyan,0.95);ctx.fillText(pill,W-48,56);}
  // progress bar
  const p=clamp(st/TOTAL,0,1);ctx.fillStyle='rgba(255,255,255,0.10)';ctx.fillRect(0,H-4,W,4);
  const pg=ctx.createLinearGradient(0,0,W,0);pg.addColorStop(0,C.violet);pg.addColorStop(1,C.cyan);ctx.fillStyle=pg;ctx.fillRect(0,H-4,W*p,4);
  ctx.restore();
}

function logoMark(x,y,r){
  ctx.save();ctx.translate(x,y);
  const g=ctx.createLinearGradient(-r,-r,r,r);g.addColorStop(0,C.violet);g.addColorStop(1,C.cyan);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.95)';ctx.lineWidth=Math.max(2.2,r*0.12);ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(-r*0.55,r*0.18);ctx.lineTo(-r*0.16,-r*0.05);ctx.lineTo(r*0.08,r*0.25);ctx.lineTo(r*0.55,-r*0.42);ctx.stroke();
  ctx.restore();
}

// ---------- generic UI pieces ----------
function panel(x,y,w,h,r=22,a=0.92){ctx.save();ctx.shadowColor='rgba(0,0,0,0.45)';ctx.shadowBlur=40;ctx.shadowOffsetY=14;ctx.fillStyle=rgba(C.panel,a);rr(x,y,w,h,r);ctx.fill();ctx.restore();ctx.strokeStyle='rgba(255,255,255,0.07)';ctx.lineWidth=1.5;rr(x,y,w,h,r);ctx.stroke();}
function pill(x,y,w,h,r=999,col,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=col;rr(x,y,w,h,r);ctx.fill();ctx.restore();}
function iconDot(x,y,r,col){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(col,0.85));g.addColorStop(1,rgba(col,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function spark(x,y,s,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=C.white;ctx.beginPath();ctx.moveTo(0,-s);ctx.quadraticCurveTo(s*0.18,-s*0.18,s,0);ctx.quadraticCurveTo(s*0.18,s*0.18,0,s);ctx.quadraticCurveTo(-s*0.18,s*0.18,-s,0);ctx.quadraticCurveTo(-s*0.18,-s*0.18,0,-s);ctx.fill();ctx.restore();}
function sparkle(x,y,s,t){const a=0.35+0.65*Math.abs(Math.sin(t*3+x));spark(x,y,s*(0.5+0.5*Math.abs(Math.sin(t*2+y))),t+y);ctx.fillStyle=rgba(C.white,0.25*a);ctx.beginPath();ctx.arc(x,y,s*0.35,0,Math.PI*2);ctx.fill();}
function drawDonut(x,y,r,w1,frac,col,track=rgba(C.line,0.8),rot=-Math.PI/2){ctx.lineWidth=w1;ctx.strokeStyle=track;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.lineCap='round';ctx.strokeStyle=col;ctx.beginPath();ctx.arc(x,y,r,rot,rot+Math.PI*2*clamp(frac,0,1));ctx.stroke();}
function countNum(x,y,val,t,font,col,align='center',baseline='alphabetic'){ctx.font=font;ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline=baseline;const v=Math.round(val*easeOut(t));ctx.fillText(v.toLocaleString('en-US'),x,y);}

// ---------- scene 1: hook ----------
function drawS1(t){
  const tt=t/scenes[0].dur; const s1=slide(tt/0.45), s2=slide((tt-0.35)/0.4), s3=slide((tt-0.55)/0.4);
  // central logo
  const r=110*s1;
  ctx.save();ctx.translate(W/2,H*0.40);
  const glow=ctx.createRadialGradient(0,0,0,0,0,r*2.4);glow.addColorStop(0,rgba(C.violet,0.4));glow.addColorStop(1,rgba(C.violet,0));ctx.fillStyle=glow;ctx.fillRect(-r*2.4,-r*2.4,r*4.8,r*4.8);
  logoMark(0,0,r);
  // orbiting ring
  ctx.strokeStyle=rgba(C.cyan,0.5);ctx.lineWidth=2;ctx.setLineDash([3,10]);ctx.beginPath();ctx.arc(0,0,r*1.35+Math.sin(t*2)*4,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  sparkle(-r*1.05,-r*0.7,9,t);sparkle(r*0.9,r*0.9,7,t+1);
  ctx.restore();
  // headline
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.save();ctx.globalAlpha=s2;
  ctx.font=setFont(76,800);ctx.fillStyle=C.white;ctx.fillText('你的涨粉参谋',W/2,H*0.68);
  const g2=ctx.createLinearGradient(W/2-280,0,W/2+280,0);g2.addColorStop(0,C.violet);g2.addColorStop(1,C.cyan);ctx.fillStyle=g2;ctx.font=setFont(76,800);ctx.fillText('GrowthMate',W/2,H*0.80);
  ctx.restore();
  ctx.save();ctx.globalAlpha=s3;ctx.font=setFont(28,400);ctx.fillStyle=C.gray;ctx.fillText('记忆 · 连续 · 自主 ｜ 常驻 Minds 的涨粉参谋',W/2,H*0.90);ctx.restore();
}

// ---------- scene 2: positioning ----------
function drawS2(t){
  const tt=t/scenes[1].dur;
  const cx=W/2-620, cw=1240, cy=210, ch=590;
  panel(cx,cy,cw,ch,28);
  // header line
  ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.font=setFont(30,600);ctx.fillStyle=C.white;ctx.fillText('不只是一个聊天代理',cx+60,cy+78);
  ctx.font=setFont(22,400);ctx.fillStyle=C.gray;ctx.fillText('A resident agent that works while you sleep',cx+60,cy+118);
  const items=[
    {icon:'memory',t:'记忆',en:'Memory',sub:'记住粉丝身份、历史互动，与你的个人声线',col:C.violet},
    {icon:'cont', t:'连续',en:'Continuity',sub:'跨天接续昨日互动，不漏掉高价值回复',col:C.cyan},
    {icon:'auto', t:'自主',en:'Autonomy',sub:'无需提示，自动生成每日增长简报与行动',col:C.coral}
  ];
  const cw1=cw-120, gap=30, iw=(cw1-gap*2)/3;
  items.forEach((it,i)=>{
    const tt0=(tt-0.25-i*0.13)/0.45; const e=slide(tt0); if(e<=0)return;
    const x=cx+60+i*(iw+gap), y=cy+170;
    ctx.save();ctx.translate(x,y);ctx.globalAlpha=e;ctx.translate(0,(1-e)*26);
    panel(0,0,iw,350,20);
    drawBehaviorIcon(iw/2,80,it.icon,it.col,54);
    ctx.textAlign='center';
    ctx.font=setFont(34,700);ctx.fillStyle=C.white;ctx.fillText(it.t,iw/2,168);
    ctx.font=setFont(20,600);ctx.fillStyle=it.col;ctx.fillText(it.en,iw/2,202);
    ctx.font=setFont(20,400);ctx.fillStyle=C.gray;ctx.textBaseline='top';
    wrap(it.sub,iw/2-90,248,iw-120,30,setFont(20,400),4);
    ctx.restore();
  });
  // bottom caption
  const be=slide((tt-0.85)/0.15);
  if(be>0){ctx.save();ctx.globalAlpha=be;ctx.textAlign='center';ctx.font=setFont(26,400);ctx.fillStyle=C.gray;ctx.fillText('它记得 · 会连续跟进 · 还会主动替你行动',W/2,H-80);ctx.restore();}
}

function drawBehaviorIcon(x,y,kind,col,s){
  ctx.save();ctx.translate(x,y);
  const g=ctx.createRadialGradient(0,0,0,0,0,s*0.9);g.addColorStop(0,rgba(col,0.22));g.addColorStop(1,rgba(col,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,s*0.9,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=4.5;ctx.lineCap='round';ctx.lineJoin='round';
  if(kind==='memory'){
    ctx.beginPath();ctx.arc(0,0,s*0.34,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-s*0.2,-s*0.05);ctx.lineTo(0,s*0.12);ctx.lineTo(s*0.24,-s*0.16);ctx.stroke();
  }else if(kind==='cont'){
    ctx.beginPath();ctx.moveTo(-s*0.42,-s*0.16);ctx.lineTo(0,-s*0.16);ctx.lineTo(0,s*0.2);ctx.lineTo(s*0.42,s*0.2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(s*0.2,s*0.02);ctx.lineTo(s*0.42,s*0.2);ctx.lineTo(s*0.2,s*0.38);ctx.stroke();
    ctx.beginPath();ctx.arc(-s*0.42,-s*0.16,s*0.12,0,Math.PI*2);ctx.fill();
  }else{
    ctx.beginPath();ctx.moveTo(0,-s*0.42);ctx.lineTo(s*0.32,-s*0.05);ctx.lineTo(s*0.06,-s*0.05);ctx.lineTo(s*0.06,s*0.42);ctx.lineTo(-s*0.06,s*0.42);ctx.lineTo(-s*0.06,-s*0.05);ctx.lineTo(-s*0.32,-s*0.05);ctx.closePath();ctx.fill();
  }
  ctx.restore();
}

// ---------- scene 3: connect ----------
function drawS3(t){
  const tt=t/scenes[2].dur;
  const left=350, lw=560, right=1010, rw=560;
  // left creator profile
  const e0=slide(tt/0.3);if(e0>0){ctx.save();ctx.globalAlpha=e0;ctx.translate(0,(1-e0)*30);
    panel(left,270,lw,540,26);
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='rgba(255,255,255,0.06)';rr(left+195,330,170,170,85);ctx.fill();
    ctx.fillStyle=rgba(C.cyan,0.9);ctx.font=setFont(66,700);ctx.fillText('阿明',left+280,415);
    ctx.font=setFont(24,600);ctx.fillStyle=C.white;ctx.fillText('视频创作者',left+280,530);
    ctx.font=setFont(21,400);ctx.fillStyle=C.gray;ctx.fillText('粉丝 42.8k · 每日发布 1 条',left+280,578);
    const stats=[['视频','128'],['互动率','8.4%'],['昨日新增','+316']];
    stats.forEach((s,i)=>{const x=left+250+i*150;ctx.fillStyle=C.white;ctx.font=setFont(30,700);ctx.fillText(s[1],x,660);ctx.font=setFont(20,400);ctx.fillStyle=C.gray;ctx.fillText(s[0],x,698);});
    ctx.restore();}
  // right Minds connection
  const e1=slide((tt-0.25)/0.4);if(e1>0){ctx.save();ctx.globalAlpha=e1;ctx.translate(0,(1-e1)*30);
    panel(right,270,rw,540,26);
    const mw=100,mx=right+rw/2,my=370;
    ctx.fillStyle='rgba(255,255,255,0.06)';rr(mx-mw/2,my-mw/2,mw,mw,28);ctx.fill();
    ctx.fillStyle=C.white;ctx.font=setFont(52,700);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('M',mx,my+4);
    ctx.font=setFont(28,600);ctx.fillStyle=C.white;ctx.fillText('Minds',mx,my+92);
    const bt=slide((tt-0.4)/0.3);const col=bt>0.5?C.green:C.violet;
    pill(mx-135,my+140,270,54,12,col,0.25+0.75*e1);ctx.strokeStyle=col;ctx.lineWidth=2;rr(mx-135,my+140,270,54,12);ctx.stroke();
    ctx.fillStyle=col;ctx.font=setFont(24,700);ctx.fillText(bt>0.5?'✓ 已连接':'连接 Minds 账号',mx,my+168);
    const e2=slide((tt-0.55)/0.3);
    if(e2>0){ctx.globalAlpha=e2;ctx.font=setFont(22,400);ctx.fillStyle=C.gray;ctx.fillText('GrowthMate 开始观察内容与粉丝',mx,my+220);ctx.fillText('建立创作者长期记忆',mx,my+252);}
    ctx.restore();}
  // connector line + particles
  const e3=slide((tt-0.35)/0.5);if(e3>0){ctx.save();ctx.globalAlpha=e3;ctx.setLineDash([7,14]);ctx.lineWidth=3;ctx.strokeStyle=rgba(C.cyan,0.8);ctx.beginPath();ctx.moveTo(left+lw+40,H*0.50);ctx.lineTo(right-40,H*0.50);ctx.stroke();ctx.setLineDash([]);
    const mx=(left+lw+right)/2, off=Math.sin(t*3)*20;ctx.fillStyle=C.cyan;ctx.beginPath();ctx.arc(mx+off,H*0.50,5,0,Math.PI*2);ctx.fill();ctx.restore();}
}

// ---------- scene 4: continuity ----------
function drawS4(t){
  const tt=t/scenes[3].dur;
  const cx=W/2-620, cw=1240, cy=230, ch=560;
  panel(cx,cy,cw,ch,28);
  // title
  ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.font=setFont(30,600);ctx.fillStyle=C.white;ctx.fillText('连续 Continuity',cx+60,cy+76);
  const dot=slide((tt-0.15)/0.3);if(dot>0){ctx.globalAlpha=dot;ctx.font=setFont(22,400);ctx.fillStyle=C.cyan;ctx.fillText('昨天 → 今天，一次不漏',cx+280,cy+76);}
  // timeline
  const y=cy+200;const e1=slide((tt-0.2)/0.4);
  if(e1>0){ctx.save();ctx.globalAlpha=e1;ctx.strokeStyle=rgba(C.line,1);ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx+80,y);ctx.lineTo(cx+cw-80,y);ctx.stroke();

// ---------- captions ----------
const voStarts=scenes.map((sc,i)=>cum[i]+sc.vo);
// durations measured from TTS (s)
const voDurs=[6.54,11.83,10.15,9.16,9.63,10.68,8.53,5.87];
function drawCaptions(t){
  for(let i=0;i<scenes.length;i++){
    const st=cum[i]+scenes[i].vo, end=st+voDurs[i]+0.4;
    if(t<st||t>end)continue;
    const a=Math.min(1,(t-st)/0.35)*Math.min(1,(end-t)/0.35);
    if(a<=0)continue;
    const parts=VO_TEXT[i].split('|');
    const zh=parts[0], en=parts[1];
    ctx.save();ctx.globalAlpha=a;ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.font=setFont(24,500);ctx.fillStyle='rgba(0,0,0,0.55)';
    const zw=Math.max(ctx.measureText(zh).width+60, ctx.measureText(en).width+60, 700);
    rr(W/2-zw/2,H-148,zw,118,18);ctx.fill();
    ctx.fillStyle=C.white;ctx.font=setFont(24,500);ctx.fillText(zh,W/2,H-118);
    ctx.fillStyle=rgba(C.gray,1);ctx.font=setFont(18,400);ctx.fillText(en,W/2,H-84);
    ctx.restore();
  }
}

// ---------- transitions ----------
function render(t){
  const si=sceneOf(t);
  ctx.clearRect(0,0,W,H);
  // capture scene (no crossfade for simplicity; each scene handles its own entrance)
  drawBG(t,si);
  const local=t-cum[si];
  scenes[si].draw(local);
  drawHeader(t);
  drawCaptions(t);
  // scene transition fade
  const in0=Math.min(1,(local)/0.4);
  const out1=Math.min(1,(scenes[si].dur-local)/0.35);
  const fade=Math.max(0,1-Math.min(in0,out1));
  if(fade>0){ctx.fillStyle=`rgba(7,8,20,${fade})`;ctx.fillRect(0,0,W,H);}
}

// ---------- capture API ----------
window.captureFrame=function(frame){
  const idx=Math.max(0,Math.min(NFRAMES-1,Math.round(frame)));
  const t=idx/FPS;
  render(t);
  return cv.toDataURL('image/jpeg',0.92);
};
window.NFRAMES=NFRAMES;
window.TOTAL=TOTAL;
window.scenes=scenes;

// preview loop
if(!window.__CAPTURE__){
  let t0=performance.now();
  (function loop(now){
    const t=((now-t0)/1000)%TOTAL;
    render(t);
    requestAnimationFrame(loop);
  })(t0);
}
